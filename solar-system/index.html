<!DOCTYPE html>
<!--
  A simple 3D simulation of our solar system built with Three.js.

  This page bootstraps the application and includes a couple of UI toggles
  for showing/hiding planetary orbits and information panels.  The heavy
  lifting happens in main.js where the scene is assembled and animated.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Solar System Simulation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Simple UI to toggle orbits and info boards -->
    <div id="ui">
      <label>
        <input type="checkbox" id="toggle-orbits" checked />
        Show orbits
      </label>
      <label>
        <input type="checkbox" id="toggle-info" checked />
        Show info panels
      </label>
    </div>
    <!-- Container for our WebGL renderer -->
    <div id="container"></div>
    <!-- Three.js from a CDN. See https://threejs.org/ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <!-- OrbitControls to allow the user to rotate, zoom and pan around the scene -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.134.0/examples/js/controls/OrbitControls.js"></script>
    <!-- Our application logic -->
    <script src="main.js"></script>
  </body>
</html>
